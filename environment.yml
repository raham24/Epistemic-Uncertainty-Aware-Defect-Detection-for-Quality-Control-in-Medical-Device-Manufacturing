# Reproducible environment for the SMT replication baseline.
#   conda env create -f environment.yml
#   conda activate paper
name: paper
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  # conda package is named `pytorch` (the pip/PyPI name is `torch`); the Python
  # import is `torch` either way. conda-forge resolves a CPU build on the cluster.
  - pytorch
  - scipy
  - pandas
  - pyyaml
  - matplotlib
  - scikit-learn
  - pip
  - pip:
      - rdflib
      - python-docx
      - optuna==4.9.0
