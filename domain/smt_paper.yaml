# =============================================================================
# SMT domain spec — the single source of truth for the synthetic generator.
#
# generator.py reads THIS file; nothing domain-specific is hard-coded in Python.
# Every field below is consumed by the code (no dead/cosmetic fields). The
# medical-device port later swaps this file for domain/insulin_pump.yaml with no
# generator code changes.
#
# Convention: deviation = (value - nominal) / half_width, so |deviation| = 1.0
# sits exactly at the nearer spec limit. Risk and labels are computed from these
# normalized deviations.
# =============================================================================

device_class: smt_assembly

# ---------------------------------------------------------------------------
# Defect classes. `prior` is a CALIBRATION TARGET: the generator solves per-class
# logit offsets so the realized marginals match these. Values are the paper's
# Table I counts as fractions of 200,000 (no_defect 175,420; open_circuit 12,011;
# solder_bridging 12,569). Labels are sampled from p(y|x), not from the priors.
# ---------------------------------------------------------------------------
defects:
  - name: no_defect
    prior: 0.877100
  - name: open_circuit
    prior: 0.060055
  - name: solder_bridging
    prior: 0.062845

# ---------------------------------------------------------------------------
# Two process stages (paper: paste printing, then reflow). Each lists its
# mechanism vocabulary, including an explicit no_mechanism.
# ---------------------------------------------------------------------------
mechanisms:
  stage_printing:
    - no_mechanism
    - aperture_overfill
    - poor_paste_transfer
  stage_reflow:
    - no_mechanism
    - reflow_spreading
    - non_coalescence

# ---------------------------------------------------------------------------
# Six monitored process parameters. nominal/lsl/usl define the spec window;
# sigma is the natural process standard deviation. half_width / sigma sets how
# often a parameter drifts out of spec. (units in comments, not used by code)
# ---------------------------------------------------------------------------
parameters:
  - id: ambient_relative_humidity   # %RH
    nominal: 50.0
    lsl: 30.0
    usl: 70.0
    sigma: 8.0
    stage: stage_printing
  - id: ambient_temperature         # C
    nominal: 25.0
    lsl: 20.0
    usl: 30.0
    sigma: 2.5
    stage: stage_printing
  - id: paste_viscosity             # Pa.s
    nominal: 100.0
    lsl: 90.0
    usl: 110.0
    sigma: 5.0
    stage: stage_printing
  - id: stencil_thickness           # um
    nominal: 100.0
    lsl: 95.0
    usl: 105.0
    sigma: 2.0
    stage: stage_printing
  - id: time_above_liquidus         # s
    nominal: 60.0
    lsl: 45.0
    usl: 75.0
    sigma: 3.0
    stage: stage_reflow
  - id: peak_reflow_temperature     # C
    nominal: 255.0
    lsl: 250.0
    usl: 260.0
    sigma: 2.5
    stage: stage_reflow

# ---------------------------------------------------------------------------
# Ishikawa-style causal map: defect <- via mechanism <- parameter (+ direction).
# Used to (a) build defect logits, (b) assign ground-truth mechanism labels,
# (c) compute the per-mechanism gated risk. `direction` = which side of nominal
# drives the defect (it gates the score's sign, not the two-sided risk magnitude).
# Matches paper Fig. 2: solder bridging via aperture_overfill (printing) +
# reflow_spreading (reflow); open circuit is the mirror image.
# ---------------------------------------------------------------------------
causal_edges:
  # solder bridging: too much paste / too much heat
  - {defect: solder_bridging, via: aperture_overfill,   parameter: stencil_thickness,         direction: high, weight: 1.5}
  - {defect: solder_bridging, via: aperture_overfill,   parameter: ambient_temperature,       direction: high, weight: 0.7}
  - {defect: solder_bridging, via: aperture_overfill,   parameter: paste_viscosity,           direction: low,  weight: 1.3}
  - {defect: solder_bridging, via: aperture_overfill,   parameter: ambient_relative_humidity, direction: high, weight: 0.8}
  - {defect: solder_bridging, via: reflow_spreading,    parameter: peak_reflow_temperature,   direction: high, weight: 1.4}
  - {defect: solder_bridging, via: reflow_spreading,    parameter: time_above_liquidus,       direction: high, weight: 1.0}
  # open circuit: too little paste / insufficient heat (mirror of bridging)
  - {defect: open_circuit,    via: poor_paste_transfer, parameter: stencil_thickness,         direction: low,  weight: 1.5}
  - {defect: open_circuit,    via: poor_paste_transfer, parameter: ambient_temperature,       direction: low,  weight: 0.7}
  - {defect: open_circuit,    via: poor_paste_transfer, parameter: paste_viscosity,           direction: high, weight: 1.3}
  - {defect: open_circuit,    via: poor_paste_transfer, parameter: ambient_relative_humidity, direction: low,  weight: 0.8}
  - {defect: open_circuit,    via: non_coalescence,     parameter: peak_reflow_temperature,   direction: low,  weight: 1.4}
  - {defect: open_circuit,    via: non_coalescence,     parameter: time_above_liquidus,       direction: low,  weight: 1.0}

# ---------------------------------------------------------------------------
# Gaussian-copula correlation structure over the 6 parameters (symmetric;
# unspecified pairs default to 0). Nearest-PD corrected at load time.
# ---------------------------------------------------------------------------
correlations:
  ambient_relative_humidity:
    ambient_temperature: -0.30
    paste_viscosity: 0.10
  ambient_temperature:
    paste_viscosity: -0.40
    peak_reflow_temperature: 0.20
  paste_viscosity:
    stencil_thickness: 0.15
  time_above_liquidus:
    peak_reflow_temperature: 0.60

# ---------------------------------------------------------------------------
# Non-stationary structure layered on top of the copula draw.
#   wear:    linear trend over the full run, in sigma units (equipment aging).
#   diurnal: sinusoid amplitude in sigma units, per shift hour-offset.
# ---------------------------------------------------------------------------
drift:
  diurnal_period_hours: 24
  parameters:
    ambient_relative_humidity: {diurnal: 0.40}
    ambient_temperature: {diurnal: 0.50}
    stencil_thickness: {wear: 0.60}
    peak_reflow_temperature: {wear: 0.30}
    time_above_liquidus: {wear: 0.20}

# ---------------------------------------------------------------------------
# Graded risk target — the paper's Eq. (8)/(9)/(10), two-sided in |deviation|:
#   z = clip((|dev| - delta_1) / (delta_2 - delta_1), 0, 1)
#   t = max(0, |dev| - delta_2)
#   P = p_L + (p_M - p_L) z^2 + (p_H - p_M)(1 - exp(-kappa t))
# Risk = p_L in spec, rises to p_M AT the limit (delta_2 = 1.0), asymptotes to
# p_H out of spec. p_L/p_M/p_H are the paper's 0.05/0.70/0.99; delta_1/2, kappa
# are reproducibility gaps (the paper gives the form, not the constants).
# ---------------------------------------------------------------------------
risk_function:
  p_L: 0.05
  p_M: 0.70
  p_H: 0.99
  delta_1: 0.50
  delta_2: 1.00
  kappa: 3.0

# ---------------------------------------------------------------------------
# Defect-label model. score(defect) = sum_edges weight * relu(directional dev).
#   logit(no_defect) = 0 (reference);  logit(defect) = gain * score + offset
# `gain` is solved so the Bayes error E_x[1 - max_y p(y|x)] == target_bayes_error
# (reproduces ~95% defect-head accuracy). Offsets are solved so E[p(y)] matches
# the defect priors above.
# ---------------------------------------------------------------------------
label_model:
  target_bayes_error: 0.045

generator:
  n_records: 200000
  n_batches: 100
  records_per_batch: 2000
  seed: 42
  train_frac: 0.70
  val_frac: 0.15
  # test = the remaining batches (0.15)
  # Fixed ISO timestamp keeps output byte-reproducible (no wall clock in data).
  build_timestamp: "2026-06-02T00:00:00Z"
